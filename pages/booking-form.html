<!doctype html> <!-- HTML5 standards mode. -->
<html lang="en"> <!-- Initial language: English. -->
  <head> <!-- Page settings and resources. -->
    <meta charset="UTF-8" /> <!-- Text encoding for accents and symbols. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Device width; normal initial zoom. -->
    <title>Book a Field | Pitch Point</title> <!-- Browser tab title. -->
    <link rel="stylesheet" href="/proyecto.html/assets/css/style.css" /> <!-- Load the shared CSS. -->
  </head> <!-- End page settings. -->
  <body> <!-- Visible page content. -->
    <div class="lang-btn-fixed"> <!-- Group the language button. -->
      <button id="lang-toggle" onclick="toggleLanguage()"> <!-- Click calls the language-switch function. -->
        <img
          id="lang-flag"
          src="https://flagcdn.com/24x18/mx.png"
          alt="Switch to Spanish"
        /> <!-- Flag indicates the next language. -->
      </button> <!-- End the language button. -->
    </div> <!-- End the language button group. -->


    <main class="booking-page">
      <a class="booking-back" id="booking-back" href="/proyecto.html/pages/bookings.html" data-i18n="back-btn"
        >← Back</a
      > <!-- Back navigation link. Translated label. -->
      <h1 data-i18n="booking-title">Book a Field</h1> <!-- Translated page heading. -->


      <form class="booking-form" id="booking-form">
        <label>
          <span data-i18n="booking-name">Your name</span>
          <input type="text" id="name" required />
          <span
            class="input-error"
            id="name-error"
            data-i18n="booking-name-error"
            >Please enter your full name (first and last name).</span
          >
        </label>
        <label>
          <span data-i18n="booking-date">Date</span>
          <input type="date" id="date" required />
        </label>
        <button type="submit" class="boton-reservar" data-i18n="booking-btn">
          Confirm Booking
        </button>
      </form>


      <div class="booking-success" id="booking-success" role="status" aria-live="polite">
        <p data-i18n="booking-success-title">✅ Booking confirmed!</p> <!-- Translated paragraph. -->
        <p id="success-name"></p>
        <p id="success-date"></p>
      </div>
    </main>

    <script src="/proyecto.html/assets/js/script.js"></script>
    <script src="/proyecto.html/assets/js/translation.js"></script> <!-- Load the language-switching code. -->
  </body> <!-- End visible page content. -->
</html> <!-- End the HTML document. -->
